name: Appify APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application Name"
        required: true
        default: "Appify App"
      app_url:
        description: "Website URL to convert"
        required: true
        default: "https://example.com"
      package_name:
        description: "Android Package Name (e.g. com.mycompany.app)"
        required: false
        default: "com.appify.web"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: pip install pillow

      - name: Prepare Android SDK Toolchain Permissions
        run: |
          chmod +x android-sdk/build-tools/aapt* android-sdk/build-tools/zipalign android-sdk/build-tools/apksigner 2>/dev/null || true

      - name: Create Build Configuration
        run: |
          python3 -c "
          import json
          config = {
              'app': {
                  'name': '${{ github.event.inputs.app_name }}',
                  'url': '${{ github.event.inputs.app_url }}',
                  'packageName': '${{ github.event.inputs.package_name }}',
                  'settings': {'pullToRefresh': True, 'cache': True},
                  'style': {'themeColor': '#2563eb', 'orientation': 'portrait'}
              },
              'build': {'version': '1.0.0', 'versionCode': 1}
          }
          with open('config.json', 'w') as f:
              json.dump(config, f)
          "

      - name: Compile and Sign Android APK
        run: |
          python3 scripts/apk_builder.py config.json app-release.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Signed-APK
          path: app-release.apk
          if-no-files-found: error
